name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Setup Python Virtual Environment and Install Dependencies
        working-directory: ./functions
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Setup GCP Auth, APIs and CORS
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'cartorio-meneghel-ai' }}
          STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        run: |
          echo "$SA_KEY" > /tmp/firebase-key.json
          gcloud auth activate-service-account --key-file=/tmp/firebase-key.json
          gcloud services enable aiplatform.googleapis.com --project "$FIREBASE_PROJECT_ID"
          gsutil cors set cors.json gs://${STORAGE_BUCKET:-$FIREBASE_PROJECT_ID.firebasestorage.app}

      - name: Delete old generate_document function to fix type mutation
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'cartorio-meneghel-ai' }}
        run: |
          firebase functions:delete generate_document --force --project "$FIREBASE_PROJECT_ID" || true

      - name: Deploy to Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'cartorio-meneghel-ai' }}
        run: |
          firebase deploy --only functions,firestore:rules,firestore:indexes,storage --force --project "$FIREBASE_PROJECT_ID"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup GCP Auth
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_KEY" > /tmp/firebase-key.json
          gcloud auth activate-service-account --key-file=/tmp/firebase-key.json

      - name: Fetch Dynamic Backend URLs
        id: get_urls
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'cartorio-meneghel-ai' }}
        run: |
          EXTRACT_URL=$(gcloud run services describe extract-document-data --region us-central1 --project "$FIREBASE_PROJECT_ID" --format 'value(status.url)' || echo "")
          GENERATE_URL=$(gcloud run services describe generate-document-api --region us-central1 --project "$FIREBASE_PROJECT_ID" --format 'value(status.url)' || echo "")
          ORCHESTRATE_URL=$(gcloud run services describe orchestrate-document --region us-central1 --project "$FIREBASE_PROJECT_ID" --format 'value(status.url)' || echo "")

          echo "EXTRACT_URL=$EXTRACT_URL" >> $GITHUB_ENV
          echo "GENERATE_URL=$GENERATE_URL" >> $GITHUB_ENV
          echo "ORCHESTRATE_URL=$ORCHESTRATE_URL" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_EXTRACT_API_URL: ${{ env.EXTRACT_URL }}
          VITE_GENERATE_API_URL: ${{ env.GENERATE_URL }}
          VITE_ORCHESTRATE_API_URL: ${{ env.ORCHESTRATE_URL }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || 'cartorio-meneghel-ai' }}
