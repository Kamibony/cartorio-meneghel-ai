name: Seed Database

on:
  workflow_dispatch:

jobs:
  seed-rag-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Python Virtual Environment and Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r functions/requirements.txt

      - name: Setup GCP Auth
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'cartorio-meneghel-ai' }}
        run: |
          echo "$SA_KEY" > /tmp/firebase-key.json
          gcloud auth activate-service-account --key-file=/tmp/firebase-key.json

      - name: Run Seed Script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'cartorio-meneghel-ai' }}
          VERTEX_AI_LOCATION: "us-central1"
          PYTHONPATH: ./functions
        run: |
          source venv/bin/activate
          python scripts/seed_rag_templates.py
